<div class="table-container">
  <h3 class="sort-header-content">
    Configuraciones - {{ descValor === 'codigo_operacion' ? 'Código de Operación' : 'RIF Piloto' }}
  </h3>

  <!-- Búsqueda por módulo -->
  <div class="search-section">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por Módulo</mat-label>
      <input matInput [(ngModel)]="moduloBusqueda" (keyup.enter)="buscarPorModulo()">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="buscarPorModulo()">Buscar</button>
    <button mat-raised-button (click)="limpiarBusqueda()">Limpiar</button>
  </div>

  <!-- Spinner de carga -->
  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Cargando datos...</p>
  </div>

  <!-- Botón registrar -->
  <div class="full-width-container">
    <button class="registrar-btn" (click)="openAddConfiguracionModal()">
      Registrar {{ descValor === 'codigo_operacion' ? 'Código de Operación' : 'RIF Piloto' }}
    </button>
  </div>

  <!-- Tabla de configuraciones -->
  <div class="full-width-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="valor">
        <td mat-cell *matCellDef="let configuracion" class="custom-cell">
          {{ configuracion.valor }}
        </td>
      </ng-container>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          (click)="onRowClicked(row)" class="clickable-row">
      </tr>
    </table>
  </div>

  <!-- Paginador -->
  <mat-paginator [length]="totalElements"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5, 10, 20]"
                 (page)="onPageChange($event)">
  </mat-paginator>

  <!-- Mensaje sin resultados -->
  <div *ngIf="!isLoading && dataSource.data.length === 0" class="alert alert-info">
    No se encontraron configuraciones.
  </div>
</div>
