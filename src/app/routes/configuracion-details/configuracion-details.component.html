<div class="modal">
  <h2>Editar Configuración</h2>

  <!-- Spinner de carga -->
  <div *ngIf="loadingData" class="loading-spinner">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando datos...</p>
  </div>

  <div *ngIf="message" class="alert"
       [ngClass]="{'alert-success': message.includes('éxito') || message.includes('exitosamente'), 'alert-danger': !(message.includes('éxito') || message.includes('exitosamente'))}">
    <div class="alert-message">{{ message }}</div>
    <span class="close-btn" (click)="message = ''">&times;</span>
  </div>

  <form *ngIf="!loadingData && originalConfiguracion">
    <div class="form-group">
      <label for="valor">Código de operación:</label>
      <input type="text" name="valor" placeholder="Valor"
             [(ngModel)]="currentConfiguracion.valor"
             [maxLength]="originalConfiguracion.longitud"
             required>
      <div *ngIf="originalConfiguracion.longitud > 0" class="length-indicator"
           [class.max-length]="currentConfiguracion.valor.length >= originalConfiguracion.longitud">
        {{ currentConfiguracion.valor.length }} / {{ originalConfiguracion.longitud }}
      </div>
    </div>

    <div class="button-group">
      <button type="button" class="update-btn"
              (click)="updateConfiguracion()"
              [disabled]="isSaving || !originalConfiguracion">
        <i *ngIf="!isSaving" class="fas fa-save"></i>
        <i *ngIf="isSaving" class="fas fa-spinner fa-spin"></i>
        {{ isSaving ? 'Guardando...' : 'Actualizar' }}
      </button>

      <button type="button" class="delete-btn"
              (click)="deleteConfiguracion()"
              [disabled]="isDeleting">
        <i *ngIf="!isDeleting" class="fas fa-trash"></i>
        <i *ngIf="isDeleting" class="fas fa-spinner fa-spin"></i>
        {{ isDeleting ? 'Eliminando...' : 'Eliminar' }}
      </button>

      <button type="button" class="btn-secondary"
              (click)="closeDialog()">
        <i class="fas fa-times"></i> Cerrar
      </button>
    </div>
  </form>

  <!-- Mensaje de error si no se cargaron los datos -->
  <div *ngIf="!loadingData && !originalConfiguracion" class="alert alert-danger">
    No se pudieron cargar los datos. Intente de nuevo.
  </div>
</div>
