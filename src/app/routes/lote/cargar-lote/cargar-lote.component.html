<div class="row">
  <div class="matero-col" fxFlex="100">
    <div class="col-md-12">
        <h3 class="title-form">Cargar Archivo en el Lote N° {{id_lote}}</h3>
    </div>
    <div class="col-md-12 flexbox">
      <form [formGroup]="cargaFormulario" id="search">
      <div style="display: flex; justify-content: center; align-items: center;">
        <div style="padding: 10px; border: 2px solid #0067b170; border-radius: 15px;">
          <p style=" margin: 0!important;text-align: center;"><i>Registro Masivo</i></p>

          <span style="width: 50%;" >
         <input type="file" id="files" (change)="handleUpload($event)" formControlName="file" class="hidden2"  accept=".txt" required/>
         <label for="files" class="label-2"> <mat-icon class="mat-icon-flex" >archive</mat-icon> Cargar Archivo</label>
          </span><br>
          <p>{{nombrearchivo}}</p>
        <span style="width: 100%;display: flex; justify-content: center; align-items: center;" >
       <button
          mat-flat-button
          type="button"
          class="btn-azulbdv2"
          #tooltip="matTooltip"
          [matTooltipClass]="'my-tooltip'"
          matTooltipPosition="right"
          (click)="submitFile()"
          [disabled]="isSubmitting"
          matTooltip="Subir carga de Registros">
          <ng-container *ngIf="!isSubmitting">
            Guardar <mat-icon>file_upload</mat-icon>
          </ng-container>
          <ng-container *ngIf="isSubmitting">
            <mat-spinner diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
            Cargando...
          </ng-container>
        </button>
      </span>
      </div>
      </div>
    </form>
    </div>
<div class="col-md-12">
  <div style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">
    <button class="btn-rojobdv btn-large-2" [disabled]="isSubmitting" (click)="regresar()" mat-flat-button >Volver</button>
  </div>
</div>
</div>
</div>
